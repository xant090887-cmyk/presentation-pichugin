<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Как говорить с директором филиала на языке P&L — Иван Пичугин</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap');

    :root {
      --bg-page: #F4F6F9;
      --bg-card: #FFFFFF;
      --text-main: #0F172A;
      --text-sub: #475569;
      --text-muted: #64748B;
      --rt-purple: #5B36D6;
      --rt-orange: #FF4F12;
      --accent-soft-purple: #F3F0FD;
      --accent-soft-orange: #FFF4EF;
      --accent-green: #16A34A;
      --accent-soft-green: #F0FDF4;
      --border-card: #E2E8F0;
      --radius-sm: 8px;
      --radius-md: 14px;
      --radius-lg: 20px;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-font-smoothing: antialiased;
    }

    body {
      background-color: var(--bg-page);
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      color: var(--text-main);
      display: flex;
      flex-direction: column;
      height: 100vh;
      overflow: hidden;
    }

    /* Верхняя панель управления */
    .top-nav {
      height: 56px;
      background: #FFFFFF;
      border-bottom: 1px solid var(--border-card);
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 24px;
      flex-shrink: 0;
      z-index: 100;
    }
    .nav-brand {
      display: flex;
      align-items: center;
      gap: 12px;
      font-size: 13px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.06em;
      color: var(--rt-purple);
    }
    .brand-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: var(--rt-orange);
    }
    .status-badge {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 6px 14px;
      border-radius: 980px;
      font-size: 12px;
      font-weight: 600;
      background: #F1F5F9;
      color: var(--text-sub);
    }
    .status-badge.speaker {
      background: var(--accent-soft-purple);
      color: var(--rt-purple);
      border: 1px solid rgba(91, 54, 214, 0.2);
    }
    .pulse-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: var(--accent-green);
      animation: pulse 1.5s infinite;
    }
    @keyframes pulse {
      0% { transform: scale(0.95); opacity: 0.7; }
      50% { transform: scale(1.2); opacity: 1; }
      100% { transform: scale(0.95); opacity: 0.7; }
    }

    .nav-actions {
      display: flex;
      align-items: center;
      gap: 10px;
    }
    .btn {
      padding: 8px 16px;
      border-radius: 8px;
      font-size: 13px;
      font-weight: 600;
      border: 1px solid var(--border-card);
      background: #FFFFFF;
      color: var(--text-main);
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      transition: all 0.15s ease;
    }
    .btn:hover {
      background: #F8FAFC;
    }
    .btn-primary {
      background: var(--rt-purple);
      color: #FFFFFF;
      border-color: var(--rt-purple);
    }
    .btn-primary:hover {
      background: #4C2BB7;
    }
    .btn-orange {
      background: var(--rt-orange);
      color: #FFFFFF;
      border-color: var(--rt-orange);
    }
    .btn-queue {
      position: relative;
      background: var(--accent-soft-orange);
      color: var(--rt-orange);
      border-color: rgba(255, 79, 18, 0.3);
    }

    /* Основная рабочая область */
    .viewport {
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
      min-height: 0;
    }

    .slide-frame {
      width: 100%;
      max-width: 1280px;
      height: 100%;
      max-height: 720px;
      background: var(--bg-page);
      border: 1px solid var(--border-card);
      border-radius: var(--radius-md);
      padding: 40px 48px;
      display: flex;
      flex-direction: column;
      position: relative;
      overflow-y: auto;
    }

    .header-group {
      margin-bottom: 20px;
      flex-shrink: 0;
    }
    .tag {
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: var(--rt-purple);
      margin-bottom: 6px;
      display: inline-flex;
      align-items: center;
      gap: 8px;
    }
    .tag::before {
      content: "";
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: var(--rt-orange);
    }
    .slide-title {
      font-size: 28px;
      font-weight: 700;
      letter-spacing: -0.02em;
      line-height: 1.2;
      color: var(--text-main);
    }
    .slide-content {
      flex: 1;
      display: flex;
      flex-direction: column;
      min-height: 0;
    }

    /* Нижняя панель листания */
    .bottom-bar {
      height: 52px;
      background: #FFFFFF;
      border-top: 1px solid var(--border-card);
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 24px;
      flex-shrink: 0;
    }
    .counter {
      font-size: 13px;
      font-weight: 600;
      color: var(--text-muted);
    }

    /* Слайд 1: Титул */
    .title-grid {
      display: grid;
      grid-template-columns: 1.15fr 0.85fr;
      gap: 40px;
      height: 100%;
      align-items: center;
    }
    .hero-title {
      font-size: 46px;
      font-weight: 700;
      letter-spacing: -0.03em;
      line-height: 1.12;
      margin-bottom: 18px;
    }
    .hero-subtitle {
      font-size: 18px;
      color: var(--text-muted);
      line-height: 1.45;
      margin-bottom: 28px;
    }
    .speaker-pill {
      display: inline-flex;
      align-items: center;
      gap: 10px;
      padding: 10px 20px;
      background: #FFFFFF;
      border: 1px solid var(--border-card);
      border-radius: 980px;
      font-size: 16px;
      font-weight: 600;
    }
    .agenda-box {
      background: #FFFFFF;
      border: 1px solid var(--border-card);
      border-radius: var(--radius-md);
      padding: 26px;
      display: flex;
      flex-direction: column;
      gap: 16px;
    }
    .agenda-item {
      display: flex;
      gap: 14px;
      align-items: flex-start;
    }
    .agenda-num {
      width: 26px;
      height: 26px;
      border-radius: 50%;
      background: var(--accent-soft-purple);
      color: var(--rt-purple);
      font-size: 12px;
      font-weight: 700;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
    }

    /* Слайд 2: Профиль */
    .profile-grid {
      display: grid;
      grid-template-columns: 340px 1fr;
      gap: 24px;
      height: 100%;
    }
    .summary-card {
      background: #FFFFFF;
      border: 1px solid var(--border-card);
      border-radius: var(--radius-md);
      padding: 24px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
    }
    .stat-badge {
      background: var(--accent-soft-purple);
      border-radius: var(--radius-sm);
      padding: 14px;
      margin-bottom: 12px;
    }
    .stat-val { font-size: 26px; font-weight: 700; color: var(--rt-purple); margin-bottom: 4px; }
    .stat-lbl { font-size: 12px; font-weight: 500; color: var(--text-sub); }
    .profile-list { display: flex; flex-direction: column; gap: 12px; height: 100%; }
    .profile-row {
      background: #FFFFFF;
      border: 1px solid var(--border-card);
      border-radius: var(--radius-md);
      padding: 18px 22px;
      flex: 1;
      display: flex;
      flex-direction: column;
      justify-content: center;
    }

    /* Слайд 3: KPI */
    .kpi-row {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 16px;
      margin-bottom: 20px;
    }
    .kpi-box {
      background: #FFFFFF;
      border: 1px solid var(--border-card);
      border-radius: var(--radius-md);
      padding: 22px 16px;
      text-align: center;
    }
    .kpi-num { font-size: 40px; font-weight: 700; color: var(--rt-purple); margin-bottom: 6px; }
    .kpi-lbl { font-size: 13.5px; color: var(--text-sub); }
    .kpi-insight {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 16px;
      flex: 1;
    }
    .insight-card {
      background: #FFFFFF;
      border: 1px solid var(--border-card);
      border-radius: var(--radius-md);
      padding: 20px 24px;
    }

    /* Слайд 4: P&L */
    .three-cols {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 20px;
      height: 100%;
    }
    .col-card {
      background: #FFFFFF;
      border: 1px solid var(--border-card);
      border-radius: var(--radius-md);
      padding: 24px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
    }
    .col-card.lead { border: 2px solid var(--rt-purple); background: #FAF9FF; }

    /* Слайд 6: Продукты */
    .matrix-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 16px;
      height: 100%;
    }
    .prod-card {
      background: #FFFFFF;
      border: 1px solid var(--border-card);
      border-radius: var(--radius-md);
      padding: 20px 24px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
    }

    /* Слайд 8: Практикум и форма One-Pager */
    .ws-container {
      display: grid;
      grid-template-columns: 360px 1fr;
      gap: 20px;
      height: 100%;
    }
    .timer-panel {
      background: #FFFFFF;
      border: 1px solid var(--border-card);
      border-radius: var(--radius-md);
      padding: 24px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
    }
    .timer-digits {
      font-size: 56px;
      font-weight: 700;
      color: var(--rt-orange);
      letter-spacing: -0.02em;
      margin: 12px 0;
      font-variant-numeric: tabular-nums;
    }
    .timer-status {
      font-size: 13px;
      font-weight: 600;
      color: var(--text-muted);
      margin-bottom: 20px;
    }
    .timer-controls {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
      justify-content: center;
    }

    .form-panel {
      background: #FFFFFF;
      border: 1px solid var(--border-card);
      border-radius: var(--radius-md);
      padding: 24px;
      display: flex;
      flex-direction: column;
      gap: 12px;
      overflow-y: auto;
    }
    .form-row {
      display: flex;
      flex-direction: column;
      gap: 4px;
    }
    .form-label {
      font-size: 12px;
      font-weight: 700;
      text-transform: uppercase;
      color: var(--rt-purple);
      letter-spacing: 0.04em;
    }
    .form-input, .form-textarea {
      width: 100%;
      padding: 8px 12px;
      border: 1px solid var(--border-card);
      border-radius: 6px;
      font-family: inherit;
      font-size: 13.5px;
      color: var(--text-main);
      background: #FAF8FC;
    }
    .form-textarea { resize: none; height: 50px; }
    .form-input:focus, .form-textarea:focus {
      outline: none;
      border-color: var(--rt-purple);
      background: #FFFFFF;
    }

    /* Модальное окно очереди кейсов */
    .modal-overlay {
      position: fixed;
      inset: 0;
      background: rgba(15, 23, 42, 0.6);
      display: none;
      align-items: center;
      justify-content: center;
      z-index: 1000;
      padding: 20px;
    }
    .modal-box {
      width: 100%;
      max-width: 720px;
      background: #FFFFFF;
      border-radius: var(--radius-lg);
      padding: 32px;
      max-height: 85vh;
      display: flex;
      flex-direction: column;
    }
    .modal-head {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 20px;
    }
    .modal-title { font-size: 20px; font-weight: 700; }
    .queue-list {
      display: flex;
      flex-direction: column;
      gap: 12px;
      overflow-y: auto;
      flex: 1;
    }
    .queue-item {
      border: 1px solid var(--border-card);
      border-radius: var(--radius-sm);
      padding: 16px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: #F8FAFC;
    }

    /* Баннер презентации выбранного кейса на Слайде 8 */
    .projected-case-banner {
      display: none;
      background: #FFFFFF;
      border: 2px solid var(--rt-purple);
      border-radius: var(--radius-md);
      padding: 24px;
      flex-direction: column;
      gap: 16px;
      height: 100%;
    }

    /* Тост оповещений */
    .toast {
      position: fixed;
      bottom: 70px;
      right: 24px;
      background: #0F172A;
      color: #FFFFFF;
      padding: 12px 20px;
      border-radius: 8px;
      font-size: 13.5px;
      font-weight: 500;
      display: none;
      z-index: 1000;
      box-shadow: 0 4px 16px rgba(0,0,0,0.2);
    }
  </style>
</head>
<body>

  <!-- Верхняя навигация -->
  <header class="top-nav">
    <div class="nav-brand">
      <span class="brand-dot"></span>
      <span>Цифровые регионы • Сессия P&L</span>

  <!-- Проектор слайдов -->

  </footer>

  <!-- Модальное окно очереди -->

        <div style="color: var(--text-muted); text-align: center; padding: 40px 0;">Очередь пока пуста</div>
      </div>
    </div>
  </div>

  <!-- Всплывающий тост -->
  <div class="toast" id="toastMsg"></div>

  <script>
    // КОНФИГУРАЦИЯ СЕССИИ

                <div class="agenda-num">1</div>

      {

        render: () => `

    // РЕНДЕР СЛАЙДА
    function renderCurrentSlide() {
      const slide = slidesData[currentSlide];
      const container = document.getElementById('slideFrame');
      container.innerHTML = `
        <div class="header-group">
          <span class="tag">${slide.tag}</span>
          <h2 class="slide-title">${slide.title}</h2>
        </div>
        <div class="slide-content">${slide.render()}</div>
      `;
      document.getElementById('slideCounter').textContent = `Слайд ${currentSlide + 1} из ${slidesData.length}`;

      // Если мы на слайде практикума и есть спроецированный кейс — показываем его
      if (currentSlide === 7 && activeProjectedCase) {
        showProjectedCaseOnScreen(activeProjectedCase);
      }
    }

    // ЛИСТАНИЕ
    function navigateSlide(dir) {
      const next = currentSlide + dir;
      if (next >= 0 && next < slidesData.length) {
        currentSlide = next;
        renderCurrentSlide();
        if (isSpeaker) {
          sendNetworkMessage({ type: 'GOTO_SLIDE', slideIndex: currentSlide });
        }
      }
    }

    // ТАЙМЕР
    function formatTimer(sec) {
      const m = Math.floor(sec / 60);
      const s = sec % 60;
      return `${String(m).padStart(2,'0')}:${String(s).padStart(2,'0')}`;
    }

    function updateTimerUI() {
      const el = document.getElementById('timerDisplay');
      if (el) el.textContent = formatTimer(timerRemaining);
    }

    function cmdTimerStart() {
      if (!isSpeaker) return;
      sendNetworkMessage({ type: 'TIMER_CMD', cmd: 'START', duration: timerRemaining });
      runTimerLocal();
    }
    function cmdTimerPause() {
      if (!isSpeaker) return;
      sendNetworkMessage({ type: 'TIMER_CMD', cmd: 'PAUSE', remaining: timerRemaining });
      pauseTimerLocal();
    }
    function cmdTimerReset() {
      if (!isSpeaker) return;
      sendNetworkMessage({ type: 'TIMER_CMD', cmd: 'RESET', duration: 300 });
      resetTimerLocal(300);
    }
    function cmdTimerAddMin() {
      if (!isSpeaker) return;
      const nw = timerRemaining + 60;
      sendNetworkMessage({ type: 'TIMER_CMD', cmd: 'ADD', remaining: nw });
      timerRemaining = nw;
      updateTimerUI();
    }

    function runTimerLocal() {
      clearInterval(timerInterval);
      timerIsRunning = true;
      const lbl = document.getElementById('timerStatusLabel');
      if (lbl) lbl.textContent = '🟢 Идет обратный отсчет...';
      timerInterval = setInterval(() => {
        if (timerRemaining > 0) {
          timerRemaining--;
          updateTimerUI();
        } else {
          clearInterval(timerInterval);
          timerIsRunning = false;
          if (lbl) lbl.textContent = '🔔 Время вышло!';
        }
      }, 1000);
    }

    function pauseTimerLocal() {
      clearInterval(timerInterval);
      timerIsRunning = false;
      const lbl = document.getElementById('timerStatusLabel');
      if (lbl) lbl.textContent = '⏸ Пауза';
    }

    function resetTimerLocal(sec) {
      clearInterval(timerInterval);
      timerIsRunning = false;
      timerRemaining = sec;
      updateTimerUI();
      const lbl = document.getElementById('timerStatusLabel');
      if (lbl) lbl.textContent = 'Ожидает старта';
    }

    // ОТПРАВКА КЕЙСА УЧАСТНИКОМ
    function submitCaseToSpeaker() {
      const author = document.getElementById('inpAuthor')?.value.trim();
      const project = document.getElementById('inpProject')?.value.trim();
      const kpi = document.getElementById('inpKpi')?.value.trim();
      const economy = document.getElementById('inpEconomy')?.value.trim();
      const protocol = document.getElementById('inpProtocol')?.value.trim();

      if (!author) {
        alert('Пожалуйста, укажите ваше имя и филиал');
        return;
      }

      const caseData = {
        id: 'c_' + Date.now(),
        author: author,
        project: project || 'Без названия',
        kpi: kpi || 'Не указан',
        economy: economy || 'Не указана',
        protocol: protocol || 'Не заполнено',
        time: new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' })
      };

      sendNetworkMessage({ type: 'NEW_CASE', caseData });
      showToast('✅ Кейс успешно отправлен на экран Ивана!');
    }

    // ОТОБРАЖЕНИЕ КЕЙСА НА ЭКРАНЕ
    function showProjectedCaseOnScreen(data) {
      activeProjectedCase = data;
      const banner = document.getElementById('projectedCaseArea');
      const form = document.getElementById('normalFormArea');
      if (!banner) return;

      banner.style.display = 'flex';
      if (form) form.style.display = 'none';

      banner.innerHTML = `
        <div style="display:flex; justify-content:space-between; align-items:center; border-bottom:1px solid var(--border-card); padding-bottom:12px;">
          <div>
            <span style="font-size:11px; font-weight:700; color:var(--rt-purple); text-transform:uppercase;">РАЗБОР КЕЙСА ИЗ ЗАЛА</span>
            <h3 style="font-size:20px; color:var(--text-main); margin-top:2px;">${data.project}</h3>
            <div style="font-size:13px; color:var(--rt-orange); font-weight:600;">Автор: ${data.author} (${data.time})</div>
          </div>
          ${isSpeaker ? `<button class="btn" onclick="clearProjectedCase()">✕ Снять с экрана</button>` : ''}
        </div>
        <div style="display:grid; grid-template-columns:1fr 1fr; gap:16px; flex:1;">
          <div style="background:#F8FAFC; padding:16px; border-radius:8px;">
            <div style="font-size:12px; font-weight:700; color:var(--rt-purple);">ПОКАЗАТЕЛЬ ГУБЕРНАТОРА</div>
            <div style="font-size:14px; margin-top:4px;">${data.kpi}</div>
          </div>
          <div style="background:#F8FAFC; padding:16px; border-radius:8px;">
            <div style="font-size:12px; font-weight:700; color:var(--rt-purple);">ЭКОНОМИКА ДЛЯ ФИЛИАЛА</div>
            <div style="font-size:14px; margin-top:4px;">${data.economy}</div>
          </div>
          <div style="grid-column: span 2; background:#FAF8FF; border-left:3px solid var(--rt-purple); padding:16px; border-radius:4px;">
            <div style="font-size:12px; font-weight:700; color:var(--rt-purple);">ПОРУЧЕНИЕ В ПРОТОКОЛ ВСТРЕЧИ</div>
            <div style="font-size:14.5px; margin-top:4px; font-weight:500;">${data.protocol}</div>
          </div>
        </div>
      `;
    }

    function clearProjectedCase() {
      activeProjectedCase = null;
      const banner = document.getElementById('projectedCaseArea');
      const form = document.getElementById('normalFormArea');
      if (banner) banner.style.display = 'none';
      if (form) form.style.display = 'flex';
      if (isSpeaker) {
        sendNetworkMessage({ type: 'CLEAR_CASE' });
      }
    }

    // МОДАЛКА ОЧЕРЕДИ КЕЙСОВ
    function openQueueModal() {
      const container = document.getElementById('queueListContainer');
      if (!casesQueue.length) {
        container.innerHTML = '<div style="color:var(--text-muted); text-align:center; padding:40px 0;">Очередь пока пуста</div>';
      } else {
        container.innerHTML = casesQueue.map((item, idx) => `
          <div class="queue-item">
            <div>
              <strong>${item.project}</strong>
              <div style="font-size:13px; color:var(--text-sub);">${item.author} • ${item.time}</div>
            </div>
            <button class="btn btn-primary" onclick="projectCaseByIndex(${idx})">Вывести на экран</button>
          </div>
        `).join('');
      }
      document.getElementById('queueModal').style.display = 'flex';
    }

    function closeQueueModal() {
      document.getElementById('queueModal').style.display = 'none';
    }

    function projectCaseByIndex(idx) {
      const item = casesQueue[idx];
      closeQueueModal();
      currentSlide = 7; // переходим на слайд практикума
      renderCurrentSlide();
      showProjectedCaseOnScreen(item);
      sendNetworkMessage({ type: 'GOTO_SLIDE', slideIndex: 7 });
      sendNetworkMessage({ type: 'PROJECT_CASE', caseData: item });
    }

    function updateQueueCounter() {
      const badge = document.getElementById('btnQueue');
      const counter = document.getElementById('queueCounter');
      if (isSpeaker) {
        badge.style.display = 'inline-flex';
        counter.textContent = `(${casesQueue.length})`;
      }
    }

    // АВТОРИЗАЦИЯ СПИКЕРА
    function promptAuth() {
      if (isSpeaker) {
        alert('Вы уже авторизованы как спикер (Иван Пичугин)');
        return;
      }
      const pin = prompt('Введите ПИН-код спикера:');
      if (pin === SPEAKER_PIN) {
        setSpeakerMode();
      } else if (pin !== null) {
        alert('Неверный ПИН-код');
      }
    }

    function setSpeakerMode() {
      isSpeaker = true;
      document.getElementById('roleBadge').className = 'status-badge speaker';
      document.getElementById('roleText').textContent = '🎙️ Спикер: Иван Пичугин';
      document.getElementById('authIcon').textContent = '✓';
      document.getElementById('authText').textContent = 'Иван (Спикер)';
      updateQueueCounter();
      renderCurrentSlide();
      showToast('Добро пожаловать, Иван! Управление презентацией активно.');
    }

    function showToast(text) {
      const t = document.getElementById('toastMsg');
      t.textContent = text;
      t.style.display = 'block';
      setTimeout(() => { t.style.display = 'none'; }, 3500);
    }

    // -------------------------------------------------------------
    // СЕТЕВОЙ ШЛЮЗ (HTTPS SSE / FETCH + LOCAL BROADCAST)
    // -------------------------------------------------------------
    const myClientId = 'u_' + Math.random().toString(36).substring(2, 9);
    const localBroadcast = typeof BroadcastChannel !== 'undefined' ? new BroadcastChannel(SESSION_ID) : null;
    const handledMsgIds = new Set();

    function sendNetworkMessage(payload) {
      payload.sender = myClientId;
      payload.msgId = myClientId + '_' + Date.now() + '_' + Math.random();

      // 1. Локально для вкладок
      if (localBroadcast) {
        localBroadcast.postMessage(payload);
      }

      // 2. В глобальную облачную сеть через защищенный HTTPS (порт 443)
      fetch(`https://ntfy.sh/${SESSION_ID}`, {
        method: 'POST',
        headers: { 'Title': 'RTK_SYNC' },
        body: JSON.stringify(payload)
      }).catch(err => console.warn('Sync POST notice:', err));
    }

    function handleIncomingMessage(msg) {
      if (!msg || msg.sender === myClientId || handledMsgIds.has(msg.msgId)) return;
      handledMsgIds.add(msg.msgId);

      // Синхронизация слайдов (для участников)
      if (msg.type === 'GOTO_SLIDE' && !isSpeaker) {
        currentSlide = msg.slideIndex;
        renderCurrentSlide();
      }

      // Синхронизация таймера
      if (msg.type === 'TIMER_CMD') {
        if (msg.cmd === 'START') {
          timerRemaining = msg.duration;
          runTimerLocal();
        } else if (msg.cmd === 'PAUSE') {
          timerRemaining = msg.remaining;
          pauseTimerLocal();
        } else if (msg.cmd === 'RESET') {
          resetTimerLocal(msg.duration);
        } else if (msg.cmd === 'ADD') {
          timerRemaining = msg.remaining;
          updateTimerUI();
        }
      }

      // Поступление нового кейса спикеру
      if (msg.type === 'NEW_CASE') {
        casesQueue.push(msg.caseData);
        updateQueueCounter();
        if (isSpeaker) {
          showToast(`📩 Новый проект от: ${msg.caseData.author}`);
        }
      }

      // Спикер проецирует кейс на экран
      if (msg.type === 'PROJECT_CASE' && !isSpeaker) {
        currentSlide = 7;
        renderCurrentSlide();
        showProjectedCaseOnScreen(msg.caseData);
      }

      // Спикер убрал кейс
      if (msg.type === 'CLEAR_CASE' && !isSpeaker) {
        clearProjectedCase();
      }
    }

    function initNetwork() {
      // Локальный канал
      if (localBroadcast) {
        localBroadcast.onmessage = (e) => handleIncomingMessage(e.data);
      }

      // Облачный канал (SSE порт 443)
      try {
        const es = new EventSource(`https://ntfy.sh/${SESSION_ID}/sse`);
        es.onopen = () => {
          if (!isSpeaker) {
            document.getElementById('roleText').textContent = '📱 Участник (синхронизация активна)';
          }
        };
        es.onmessage = (e) => {
          try {
            const raw = JSON.parse(e.data);
            if (raw.event === 'message') {
              const parsed = JSON.parse(raw.message);
              handleIncomingMessage(parsed);
            }
          } catch(err) {}
        };
        es.onerror = () => {
          console.warn('SSE reconnecting...');
        };
      } catch(e) {
        console.error('SSE init error', e);
      }
    }

    // Инициализация при старте
    window.addEventListener('DOMContentLoaded', () => {
      initNetwork();

      // Проверка параметра ссылки ?pin=1014
      const urlParams = new URLSearchParams(window.location.search);
      if (urlParams.get('pin') === SPEAKER_PIN) {
        setSpeakerMode();
      }

      renderCurrentSlide();

      // Клавиатурное листание (для ноутбука)
      window.addEventListener('keydown', (e) => {
        if (e.key === 'ArrowRight' || e.key === ' ') navigateSlide(1);
        if (e.key === 'ArrowLeft') navigateSlide(-1);
      });
    });
  </script>
