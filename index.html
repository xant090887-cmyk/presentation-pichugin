<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Как говорить с директором филиала на языке P&L — Иван Пичугин</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap');

    :root {
      --bg-page: #F4F6F9;
      --bg-card: #FFFFFF;
      --text-main: #0F172A;
      --text-sub: #475569;
      --text-muted: #64748B;
      --rt-purple: #5B36D6;
      --rt-orange: #FF4F12;
      --accent-soft-purple: #F3F0FD;
      --accent-soft-orange: #FFF4EF;
      --accent-green: #16A34A;
      --accent-soft-green: #F0FDF4;
      --border-card: #E2E8F0;
      --radius-sm: 8px;
      --radius-md: 14px;
      --radius-lg: 20px;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-font-smoothing: antialiased;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      background-color: var(--bg-page);
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      color: var(--text-main);
      display: flex;
      flex-direction: column;
      min-height: 100dvh;
      overflow-x: hidden;
    }

    /* Верхняя панель */
    .top-nav {
      min-height: 54px;
      background: #FFFFFF;
      border-bottom: 1px solid var(--border-card);
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 8px 16px;
      flex-shrink: 0;
      z-index: 100;
      gap: 12px;
      position: sticky;
      top: 0;
    }
    .nav-brand {
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 12px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      color: var(--rt-purple);
      white-space: nowrap;
    }
    .brand-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: var(--rt-orange);
      flex-shrink: 0;
    }
    .status-badge {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 4px 10px;
      border-radius: 980px;
      font-size: 11px;
      font-weight: 600;
      background: #F1F5F9;
      color: var(--text-sub);
      white-space: nowrap;
    }
    .status-badge.speaker {
      background: var(--accent-soft-purple);
      color: var(--rt-purple);
      border: 1px solid rgba(91, 54, 214, 0.25);
    }
    .pulse-dot {
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background: var(--accent-green);
      animation: pulse 1.6s infinite ease-in-out;
      flex-shrink: 0;
    }
    @keyframes pulse {
      0%, 100% { transform: scale(0.9); opacity: 0.6; }
      50% { transform: scale(1.25); opacity: 1; }
    }

    .nav-actions {
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .btn {
      padding: 7px 13px;
      border-radius: 8px;
      font-size: 12.5px;
      font-weight: 600;
      border: 1px solid var(--border-card);
      background: #FFFFFF;
      color: var(--text-main);
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      transition: all 0.15s ease;
      white-space: nowrap;
    }
    .btn:hover { background: #F8FAFC; }
    .btn-primary { background: var(--rt-purple); color: #FFFFFF; border-color: var(--rt-purple); }
    .btn-primary:hover { background: #4C2BB7; }
    .btn-orange { background: var(--rt-orange); color: #FFFFFF; border-color: var(--rt-orange); }
    .btn-orange:hover { background: #E03E05; }
    .btn-queue {
      background: var(--accent-soft-orange);
      color: var(--rt-orange);
      border-color: rgba(255, 79, 18, 0.3);
    }

    /* Рабочая область просмотра */
    .viewport {
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 16px;
      overflow-y: auto;
      -webkit-overflow-scrolling: touch;
    }

    .slide-frame {
      width: 100%;
      max-width: 1280px;
      min-height: 580px;
      background: var(--bg-page);
      border: 1px solid var(--border-card);
      border-radius: var(--radius-md);
      padding: 36px 40px;
      display: flex;
      flex-direction: column;
      position: relative;
    }

    .header-group {
      margin-bottom: 22px;
      flex-shrink: 0;
    }
    .tag {
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: var(--rt-purple);
      margin-bottom: 6px;
      display: inline-flex;
      align-items: center;
      gap: 8px;
    }
    .tag::before {
      content: "";
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: var(--rt-orange);
    }
    .slide-title {
      font-size: 28px;
      font-weight: 700;
      letter-spacing: -0.02em;
      line-height: 1.25;
      color: var(--text-main);
    }

    .slide-content {
      flex: 1;
      display: flex;
      flex-direction: column;
    }

    /* Нижняя панель навигации */
    .bottom-bar {
      min-height: 52px;
      background: #FFFFFF;
      border-top: 1px solid var(--border-card);
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 8px 16px;
      flex-shrink: 0;
      position: sticky;
      bottom: 0;
      z-index: 90;
    }
    .counter {
      font-size: 12.5px;
      font-weight: 600;
      color: var(--text-muted);
    }

    /* Слайд 1: Титул (без дублей) */
    .hero-center {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 24px 0;
      max-width: 900px;
      margin: auto;
    }
    .hero-title {
      font-size: 44px;
      font-weight: 800;
      letter-spacing: -0.03em;
      line-height: 1.15;
      margin-bottom: 18px;
      color: var(--text-main);
    }
    .hero-subtitle {
      font-size: 19px;
      color: var(--text-sub);
      line-height: 1.45;
      margin-bottom: 28px;
      max-width: 740px;
    }
    .speaker-pill {
      display: inline-flex;
      align-items: center;
      gap: 10px;
      padding: 10px 22px;
      background: #FFFFFF;
      border: 1px solid var(--border-card);
      border-radius: 980px;
      font-size: 15px;
      font-weight: 600;
      margin-bottom: 36px;
    }
    .agenda-box-title {
      font-size: 12px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.06em;
      color: var(--rt-purple);
      margin-bottom: 14px;
      text-align: left;
    }
    .agenda-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 16px;
      text-align: left;
      width: 100%;
    }
    .agenda-card {
      background: #FFFFFF;
      border: 1px solid var(--border-card);
      border-radius: var(--radius-md);
      padding: 18px 20px;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }
    .agenda-num {
      width: 26px;
      height: 26px;
      border-radius: 50%;
      background: var(--accent-soft-purple);
      color: var(--rt-purple);
      font-size: 12px;
      font-weight: 700;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .agenda-text-title {
      font-size: 14.5px;
      font-weight: 700;
      color: var(--text-main);
    }
    .agenda-text-desc {
      font-size: 13px;
      color: var(--text-sub);
      line-height: 1.4;
    }

    /* Слайд 2: Профиль */
    .profile-grid {
      display: grid;
      grid-template-columns: 320px 1fr;
      gap: 20px;
    }
    .summary-card {
      background: #FFFFFF;
      border: 1px solid var(--border-card);
      border-radius: var(--radius-md);
      padding: 22px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      gap: 16px;
    }
    .stat-badge {
      background: var(--accent-soft-purple);
      border-radius: var(--radius-sm);
      padding: 14px;
    }
    .stat-val { font-size: 26px; font-weight: 800; color: var(--rt-purple); margin-bottom: 4px; }
    .stat-lbl { font-size: 12px; font-weight: 500; color: var(--text-sub); }
    .profile-list { display: flex; flex-direction: column; gap: 12px; }
    .profile-row {
      background: #FFFFFF;
      border: 1px solid var(--border-card);
      border-radius: var(--radius-md);
      padding: 16px 20px;
    }

    /* Слайд 3: KPI */
    .kpi-row {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 16px;
      margin-bottom: 18px;
    }
    .kpi-box {
      background: #FFFFFF;
      border: 1px solid var(--border-card);
      border-radius: var(--radius-md);
      padding: 20px 16px;
      text-align: center;
    }
    .kpi-num { font-size: 36px; font-weight: 800; color: var(--rt-purple); margin-bottom: 6px; }
    .kpi-lbl { font-size: 13px; color: var(--text-sub); }
    .kpi-insight {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 16px;
    }
    .insight-card {
      background: #FFFFFF;
      border: 1px solid var(--border-card);
      border-radius: var(--radius-md);
      padding: 20px 22px;
    }

    /* Общие сетки */
    .three-cols {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 16px;
    }
    .col-card {
      background: #FFFFFF;
      border: 1px solid var(--border-card);
      border-radius: var(--radius-md);
      padding: 22px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
    }
    .col-card.lead { border: 2px solid var(--rt-purple); background: #FAF9FF; }

    .matrix-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 16px;
    }
    .prod-card {
      background: #FFFFFF;
      border: 1px solid var(--border-card);
      border-radius: var(--radius-md);
      padding: 18px 22px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
    }

    /* Слайд 8: Практикум и форма One-Pager */
    .ws-container {
      display: grid;
      grid-template-columns: 320px 1fr;
      gap: 20px;
    }
    .timer-panel {
      background: #FFFFFF;
      border: 1px solid var(--border-card);
      border-radius: var(--radius-md);
      padding: 22px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      gap: 12px;
    }
    .timer-digits {
      font-size: 52px;
      font-weight: 800;
      color: var(--rt-orange);
      letter-spacing: -0.02em;
      font-variant-numeric: tabular-nums;
    }
    .timer-status {
      font-size: 13px;
      font-weight: 600;
      color: var(--text-muted);
    }
    .timer-controls {
      display: flex;
      gap: 6px;
      flex-wrap: wrap;
      justify-content: center;
    }

    .form-panel {
      background: #FFFFFF;
      border: 1px solid var(--border-card);
      border-radius: var(--radius-md);
      padding: 22px;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }
    .form-row {
      display: flex;
      flex-direction: column;
      gap: 4px;
    }
    .form-label {
      font-size: 12px;
      font-weight: 700;
      text-transform: uppercase;
      color: var(--rt-purple);
      letter-spacing: 0.04em;
    }
    .form-input, .form-textarea {
      width: 100%;
      padding: 10px 12px;
      border: 1px solid var(--border-card);
      border-radius: 6px;
      font-family: inherit;
      font-size: 14.5px;
      color: var(--text-main);
      background: #FAF8FC;
    }
    .form-textarea { resize: vertical; min-height: 56px; }
    .form-input:focus, .form-textarea:focus {
      outline: none;
      border-color: var(--rt-purple);
      background: #FFFFFF;
    }

    .projected-case-banner {
      display: none;
      background: #FFFFFF;
      border: 2px solid var(--rt-purple);
      border-radius: var(--radius-md);
      padding: 22px;
      flex-direction: column;
      gap: 14px;
    }

    /* Модальное окно очереди */
    .modal-overlay {
      position: fixed;
      inset: 0;
      background: rgba(15, 23, 42, 0.6);
      display: none;
      align-items: center;
      justify-content: center;
      z-index: 1000;
      padding: 16px;
    }
    .modal-box {
      width: 100%;
      max-width: 640px;
      background: #FFFFFF;
      border-radius: var(--radius-lg);
      padding: 24px;
      max-height: 85vh;
      display: flex;
      flex-direction: column;
    }
    .modal-head {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 16px;
    }
    .queue-list {
      display: flex;
      flex-direction: column;
      gap: 10px;
      overflow-y: auto;
    }
    .queue-item {
      border: 1px solid var(--border-card);
      border-radius: var(--radius-sm);
      padding: 14px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: #F8FAFC;
      gap: 12px;
    }

    .toast {
      position: fixed;
      bottom: 66px;
      right: 16px;
      left: 16px;
      max-width: 420px;
      margin: 0 auto;
      background: #0F172A;
      color: #FFFFFF;
      padding: 12px 18px;
      border-radius: 8px;
      font-size: 13.5px;
      font-weight: 500;
      display: none;
      z-index: 1000;
      box-shadow: 0 4px 16px rgba(0,0,0,0.2);
      text-align: center;
    }

    /* ========================================================
       АДАПТИВНОСТЬ ДЛЯ СМАРТФОНОВ И ПЛАНШЕТОВ (MOBILE FIRST)
       ======================================================== */
    @media (max-width: 900px) {
      .viewport {
        padding: 10px 8px;
      }
      .slide-frame {
        padding: 20px 16px;
        min-height: auto;
        border-radius: var(--radius-sm);
      }
      .hero-title {
        font-size: 28px;
        line-height: 1.2;
      }
      .hero-subtitle {
        font-size: 15px;
        margin-bottom: 20px;
      }
      .slide-title {
        font-size: 20px;
      }
      .agenda-grid {
        grid-template-columns: 1fr;
        gap: 10px;
      }
      .profile-grid {
        grid-template-columns: 1fr;
        gap: 14px;
      }
      .kpi-row {
        grid-template-columns: 1fr 1fr;
        gap: 10px;
      }
      .kpi-num {
        font-size: 28px;
      }
      .kpi-insight {
        grid-template-columns: 1fr;
        gap: 10px;
      }
      .three-cols {
        grid-template-columns: 1fr;
        gap: 12px;
      }
      .matrix-grid {
        grid-template-columns: 1fr;
        gap: 12px;
      }
      /* На Слайде 8: вертикальное расположение без необходимости крутить телефон */
      .ws-container {
        grid-template-columns: 1fr;
        gap: 16px;
      }
      .timer-digits {
        font-size: 40px;
      }
      .form-input, .form-textarea {
        font-size: 16px; /* Предотвращает нежелательный зум на iPhone */
      }
      .nav-brand span:last-child {
        display: none;
      }
      .status-badge {
        font-size: 10px;
        padding: 3px 8px;
      }
      .top-nav {
        padding: 6px 12px;
      }
      .btn {
        padding: 6px 10px;
        font-size: 11.5px;
      }
    }
  </style>
</head>
<body>

  <!-- Верхняя навигация -->
  <header class="top-nav">
    <div class="nav-brand">
      <span class="brand-dot"></span>
      <span>Цифровые регионы</span>
      <span style="color:var(--text-muted); font-weight:500;">/ P&L</span>
    </div>

    <div id="roleBadge" class="status-badge">
      <span class="pulse-dot"></span>
      <span id="roleText">Подключение...</span>
    </div>

    <div class="nav-actions">
      <button id="btnQueue" class="btn btn-queue" style="display: none;" onclick="openQueueModal()">
        <span>📩 Кейсы</span>
        <strong id="queueCounter">(0)</strong>
      </button>

      <button id="btnAuth" class="btn" onclick="promptAuth()">
        <span id="authIcon">🔒</span>
        <span id="authText">Спикер</span>
      </button>
    </div>
  </header>

  <!-- Проектор слайдов -->
  <main class="viewport">
    <div class="slide-frame" id="slideFrame">
      <!-- Слайды генерируются через JS -->
    </div>
  </main>

  <!-- Нижняя панель листания -->
  <footer class="bottom-bar">
    <button class="btn" id="btnPrev" onclick="navigateSlide(-1)">← Назад</button>
    <span class="counter" id="slideCounter">Слайд 1 из 14</span>
    <button class="btn btn-primary" id="btnNext" onclick="navigateSlide(1)">Вперед →</button>
  </footer>

  <!-- Модальное окно очереди -->
  <div class="modal-overlay" id="queueModal">
    <div class="modal-box">
      <div class="modal-head">
        <h3 style="font-size:18px; font-weight:700;">Поступившие проекты из зала</h3>
        <button class="btn" onclick="closeQueueModal()">✕</button>
      </div>
      <div class="queue-list" id="queueListContainer">
        <div style="color: var(--text-muted); text-align: center; padding: 30px 0;">Очередь пока пуста</div>
      </div>
    </div>
  </div>

  <!-- Всплывающий тост -->
  <div class="toast" id="toastMsg"></div>

  <script>
    // КОНФИГУРАЦИЯ СЕССИИ
    const SESSION_ID = 'rtk_pichugin_live_2026';
    const SPEAKER_PIN = '1014';

    let isSpeaker = false;
    let currentSlide = 0;
    let casesQueue = [];
    let activeProjectedCase = null;

    // Таймер
    let timerDuration = 300;
    let timerRemaining = 300;
    let timerInterval = null;
    let timerIsRunning = false;

    // СЛАЙДЫ
    const slidesData = [
      {
        tag: "Цифровые регионы",
        title: "", // Пусто, чтобы не было дубля шапки на титуле
        render: () => `
          <div class="hero-center">
            <span class="tag" style="margin-bottom:12px;">Практика партнерства</span>
            <h1 class="hero-title">Как говорить с директором филиала на языке P&L</h1>
            <p class="hero-subtitle">Руководство по совместному управлению ростом бизнеса для заместителя по цифровому региону</p>
            <div class="speaker-pill">🎙️ Иван Пичугин</div>

            <div style="width:100%; max-width:860px;">
              <div class="agenda-box-title">Программа сессии</div>
              <div class="agenda-grid">
                <div class="agenda-card">
                  <div class="agenda-num">1</div>
                  <div class="agenda-text-title">Экономика филиала и Стратегия-2030</div>
                  <div class="agenda-text-desc">Взгляд директора на бизнес, баланс маржинальности и рисков</div>
                </div>
                <div class="agenda-card">
                  <div class="agenda-num">2</div>
                  <div class="agenda-text-title">Внешняя повестка и губернатор</div>
                  <div class="agenda-text-desc">Указ № 1014, рейтинг РЦТ и упаковка решений в One-Pager</div>
                </div>
                <div class="agenda-card">
                  <div class="agenda-num">3</div>
                  <div class="agenda-text-title">Партнерство и нетворкинг</div>
                  <div class="agenda-text-desc">Защита от рисков, воронка и выход на площадки региона</div>
                </div>
              </div>
            </div>
          </div>
        `
      },
      {
        tag: "Портрет руководителя",
        title: "Он отвечает за весь регион, а не за отдельные службы",
        render: () => `
          <div class="profile-grid">
            <div class="summary-card">
              <div>
                <div class="stat-badge">
                  <div class="stat-val">100% P&L</div>

                </div>
                <div class="stat-badge">
                  <div class="stat-val">100–1200+</div>
                  <div class="stat-lbl">Сотрудников в контуре ежедневного управления</div>
                </div>
              </div>
              <div style="font-size:13px; color:var(--text-sub); line-height:1.45;">
                Директор держит в фокусе аварии, безопасность, проверки надзорных органов и выполнение годового бизнес-плана.
              </div>
            </div>
            <div class="profile-list">
              <div class="profile-row">

    // РЕНДЕР СЛАЙДА БЕЗ ДУБЛИРОВАНИЯ ЗАГОЛОВКА НА ТИТУЛЕ
    function renderCurrentSlide() {
      const slide = slidesData[currentSlide];
      const container = document.getElementById('slideFrame');
      
      if (currentSlide === 0) {
        // На титуле только чистый центрированный контент
        container.innerHTML = `<div class="slide-content">${slide.render()}</div>`;
      } else {
        container.innerHTML = `
          <div class="header-group">
            <span class="tag">${slide.tag}</span>
            <h2 class="slide-title">${slide.title}</h2>
          </div>
          <div class="slide-content">${slide.render()}</div>
        `;
      }

      document.getElementById('slideCounter').textContent = `Слайд ${currentSlide + 1} из ${slidesData.length}`;

      if (currentSlide === 7 && activeProjectedCase) {
        showProjectedCaseOnScreen(activeProjectedCase);
      }
      
      // Скроллим наверх при смене слайда на смартфонах
      window.scrollTo({ top: 0, behavior: 'smooth' });
      container.scrollTop = 0;
    }

    // ЛИСТАНИЕ
    function navigateSlide(dir) {
      const next = currentSlide + dir;
      if (next >= 0 && next < slidesData.length) {
        currentSlide = next;
        renderCurrentSlide();
        if (isSpeaker) {
          sendNetworkMessage({ type: 'GOTO_SLIDE', slideIndex: currentSlide });
        }
      }
    }

    // ТАЙМЕР
    function formatTimer(sec) {
      const m = Math.floor(sec / 60);
      const s = sec % 60;
      return `${String(m).padStart(2,'0')}:${String(s).padStart(2,'0')}`;
    }

    function updateTimerUI() {
      const el = document.getElementById('timerDisplay');
      if (el) el.textContent = formatTimer(timerRemaining);
    }

    function cmdTimerStart() {
      if (!isSpeaker) return;
      sendNetworkMessage({ type: 'TIMER_CMD', cmd: 'START', duration: timerRemaining });
      runTimerLocal();
    }
    function cmdTimerPause() {
      if (!isSpeaker) return;
      sendNetworkMessage({ type: 'TIMER_CMD', cmd: 'PAUSE', remaining: timerRemaining });
      pauseTimerLocal();
    }
    function cmdTimerReset() {
      if (!isSpeaker) return;
      sendNetworkMessage({ type: 'TIMER_CMD', cmd: 'RESET', duration: 300 });
      resetTimerLocal(300);
    }
    function cmdTimerAddMin() {
      if (!isSpeaker) return;
      const nw = timerRemaining + 60;
      sendNetworkMessage({ type: 'TIMER_CMD', cmd: 'ADD', remaining: nw });
      timerRemaining = nw;
      updateTimerUI();
    }

    function runTimerLocal() {
      clearInterval(timerInterval);
      timerIsRunning = true;
      const lbl = document.getElementById('timerStatusLabel');
      if (lbl) lbl.textContent = '🟢 Идет обратный отсчет...';
      timerInterval = setInterval(() => {
        if (timerRemaining > 0) {
          timerRemaining--;
          updateTimerUI();
        } else {
          clearInterval(timerInterval);
          timerIsRunning = false;
          if (lbl) lbl.textContent = '🔔 Время вышло!';
        }
      }, 1000);
    }

    function pauseTimerLocal() {
      clearInterval(timerInterval);
      timerIsRunning = false;
      const lbl = document.getElementById('timerStatusLabel');
      if (lbl) lbl.textContent = '⏸ Пауза';
    }

    function resetTimerLocal(sec) {
      clearInterval(timerInterval);
      timerIsRunning = false;
      timerRemaining = sec;
      updateTimerUI();
      const lbl = document.getElementById('timerStatusLabel');
      if (lbl) lbl.textContent = 'Ожидает старта';
    }

      showToast('✅ Кейс успешно отправлен на экран Ивана!');

    // СЕТЕВОЙ ШЛЮЗ С УСТОЙЧИВЫМ ПОДКЛЮЧЕНИЕМ И FALLBACK ДЛЯ КОРП. СЕТИ
    // -------------------------------------------------------------
    const myClientId = 'u_' + Math.random().toString(36).substring(2, 9);
    const localBroadcast = typeof BroadcastChannel !== 'undefined' ? new BroadcastChannel(SESSION_ID) : null;
    const handledMsgIds = new Set();
    let isConnectedOnline = false;

    function sendNetworkMessage(payload) {
      payload.sender = myClientId;
      payload.msgId = myClientId + '_' + Date.now() + '_' + Math.random();

      if (localBroadcast) {
        localBroadcast.postMessage(payload);
      }

      fetch(`https://ntfy.sh/${SESSION_ID}`, {
        method: 'POST',
        headers: { 'Title': 'RTK_SYNC' },
        body: JSON.stringify(payload)
      }).catch(() => {});
    }

    function handleIncomingMessage(msg) {
      if (!msg || msg.sender === myClientId || handledMsgIds.has(msg.msgId)) return;
      handledMsgIds.add(msg.msgId);

      if (msg.type === 'GOTO_SLIDE' && !isSpeaker) {
        currentSlide = msg.slideIndex;
        renderCurrentSlide();
      }

      if (msg.type === 'TIMER_CMD') {
        if (msg.cmd === 'START') {
          timerRemaining = msg.duration;
          runTimerLocal();
        } else if (msg.cmd === 'PAUSE') {
          timerRemaining = msg.remaining;
          pauseTimerLocal();
        } else if (msg.cmd === 'RESET') {
          resetTimerLocal(msg.duration);
        } else if (msg.cmd === 'ADD') {
          timerRemaining = msg.remaining;
          updateTimerUI();
        }
      }

      if (msg.type === 'NEW_CASE') {
        casesQueue.push(msg.caseData);
        updateQueueCounter();
        if (isSpeaker) {
          showToast(`📩 Новый проект от: ${msg.caseData.author}`);
        }
      }

      if (msg.type === 'PROJECT_CASE' && !isSpeaker) {
        currentSlide = 7;
        renderCurrentSlide();
        showProjectedCaseOnScreen(msg.caseData);
      }

      if (msg.type === 'CLEAR_CASE' && !isSpeaker) {
        clearProjectedCase();
      }
    }

    function initNetwork() {
      if (localBroadcast) {
        localBroadcast.onmessage = (e) => handleIncomingMessage(e.data);
      }

      // Таймаут безопасности: если корпоративная сеть блокирует постоянный SSE-стрим,
      // мы не зависаем в бесконечном «Подключение...»
      const connectionTimer = setTimeout(() => {
        if (!isConnectedOnline) {
          if (!isSpeaker) {
            document.getElementById('roleText').textContent = '📱 Режим участника';
          }
          startPollingFallback();
        }
      }, 3500);

      try {
        const es = new EventSource(`https://ntfy.sh/${SESSION_ID}/sse`);
        es.onopen = () => {
          isConnectedOnline = true;
          clearTimeout(connectionTimer);
          if (!isSpeaker) {
            document.getElementById('roleText').textContent = '📱 В эфире (онлайн)';
          }
        };
        es.onmessage = (e) => {
          try {
            const raw = JSON.parse(e.data);
            if (raw.event === 'message') {
              const parsed = JSON.parse(raw.message);
              handleIncomingMessage(parsed);
            }
          } catch(err) {}
        };
        es.onerror = () => {
          if (!isSpeaker && !isConnectedOnline) {
            document.getElementById('roleText').textContent = '📱 Режим участника';
          }
          startPollingFallback();
        };
      } catch(e) {
        startPollingFallback();
      }
    }

    // Резервный опрос для строгих сетей
    let pollingStarted = false;
    function startPollingFallback() {
      if (pollingStarted) return;
      pollingStarted = true;
      setInterval(() => {
        fetch(`https://ntfy.sh/${SESSION_ID}/json?poll=1&since=3s`)
          .then(res => res.text())
          .then(text => {
            const lines = text.trim().split('\n');
            lines.forEach(line => {
              try {
                const item = JSON.parse(line);
                if (item.event === 'message') {
                  handleIncomingMessage(JSON.parse(item.message));
                }
              } catch(e) {}
            });
          }).catch(() => {});
      }, 2500);
    }

    // Инициализация при старте и свайп-навигация
    window.addEventListener('DOMContentLoaded', () => {
      initNetwork();

      const urlParams = new URLSearchParams(window.location.search);
      if (urlParams.get('pin') === SPEAKER_PIN) {
        setSpeakerMode();
      }

      renderCurrentSlide();

      // Клавиатурное листание
      window.addEventListener('keydown', (e) => {
        if (e.target.tagName === 'INPUT' || e.target.tagName === 'TEXTAREA') return;
        if (e.key === 'ArrowRight' || e.key === ' ') navigateSlide(1);
        if (e.key === 'ArrowLeft') navigateSlide(-1);
      });

      // Сенсорная свайп-навигация для смартфонов
      let touchStartX = 0;
      let touchEndX = 0;
      const frame = document.getElementById('slideFrame');

      frame.addEventListener('touchstart', (e) => {
        touchStartX = e.changedTouches[0].screenX;
      }, { passive: true });

      frame.addEventListener('touchend', (e) => {
        touchEndX = e.changedTouches[0].screenX;
        handleSwipe();
      }, { passive: true });

      function handleSwipe() {
        // Игнорируем свайп внутри формы и полей ввода
        const activeTag = document.activeElement ? document.activeElement.tagName : '';
        if (activeTag === 'INPUT' || activeTag === 'TEXTAREA') return;

        const diff = touchEndX - touchStartX;
        if (Math.abs(diff) > 55) {
          if (diff < 0) navigateSlide(1);  // Свайп влево -> следующий
          else navigateSlide(-1);          // Свайп вправо -> предыдущий
        }
      }
    });
  </script>
</body>
</html>
